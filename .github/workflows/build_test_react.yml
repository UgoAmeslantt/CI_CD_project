name: "Build and Test and Deploy React Application"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        python-version: [3.9]

    steps:
      - uses: actions/checkout@v3

      # --- 1. SETUP NODE.JS & TESTS REACT ---
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Install dependencies & run frontend tests
        run: |
          npm ci
          npm run test
          
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # --- 2. SETUP PYTHON & TESTS BACKEND ---
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install backend dependencies & run pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi uvicorn mysql-connector-python
          pytest server/test_main.py

      # --- 3. DOCKER STACK & INFRASTRUCTURE TESTS ---
      - name: Start Docker Compose stack
        run: |
          docker compose up -d
          
      - name: Run infrastructure connection tests
        run: |
          python test_infra.py

      # --- 4. CYPRESS E2E TESTS ---
      - name: Cypress E2E run
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://localhost:3000'
          spec: cypress/e2e/projet_individuel.cy.js

      # --- 5. BUILD FOR DEPLOYMENT ---
      - name: Build React application
        env:
          REACT_APP_API_URL: https://cicd-project-bay-omega.vercel.app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v3
        
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build_test
    steps:
      # --- GitHub Pages Deployment ---
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # --- Vercel API Deployment ---
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy Backend to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'